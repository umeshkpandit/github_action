# Lesson 1: a workflow is a file of jobs, and each job is a list of steps.
# This file runs on every push to main, and you can also start it by hand
# from the Actions tab (workflow_dispatch).

name: 01 Hello

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions"

      - name: Show which event started this run
        run: echo "Event is ${{ github.event_name }}"

      - name: Show the commit that was pushed
        run: echo "Commit SHA is ${{ github.sha }}"

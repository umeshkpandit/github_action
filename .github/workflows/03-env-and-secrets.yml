# Lesson 3: env values are plain configuration. Secrets are stored in the
# repo settings and injected at runtime. GitHub masks secret values in logs.
# If DEMO_GREETING is not set yet, this workflow still passes.

name: 03 Env and secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: github-action-lessons

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Use the workflow env and a step env
        env:
          LESSON: env-and-secrets
        run: echo "$APP_NAME lesson is $LESSON"

      - name: Read a secret, or fall back when it is unset
        env:
          GREETING: ${{ secrets.DEMO_GREETING }}
        run: |
          if [ -z "$GREETING" ]; then
            echo "Hello from the workflow (DEMO_GREETING is not set)"
          else
            echo "$GREETING"
          fi

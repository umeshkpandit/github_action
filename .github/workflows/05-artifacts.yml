# Lesson 5: jobs do not share a disk. An artifact is a file uploaded
# from one job and downloaded in a later job.

name: 05 Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build a release file
        run: npm run build

      - name: Upload the release file
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release.txt

  check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the release file
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Show the file built by the other job
        run: cat release.txt

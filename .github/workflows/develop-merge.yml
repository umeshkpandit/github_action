# Runs only after a pull request is merged into develop.
# Opening or updating the pull request is handled by ci.yml.

name: Develop merge

on:
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  integrate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Record the merge
        run: |
          echo "Merged PR #${{ github.event.pull_request.number }} into develop"
          echo "Title: ${{ github.event.pull_request.title }}"
          echo "Staging build:"
          cat dist/release.txt
